apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop
  # labels related to deployment
  labels:
    project: roboshop
    component: database
    tier: backend
spec:
  replicas: 1
  selector: 
    # match labels for the pods managed by this deployment
    matchLabels:
      project: roboshop
      component: database
      tier: backend
  template:
    metadata:
    # labels for the pods within this template
      labels:
        project: roboshop
        component: database
        tier: backend
    spec:
      containers:
      - name: mongodb
        image: hanumanth897/mongodb:4.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  # labels related to service
  labels:
    project: roboshop
    component: database
    tier: backend
spec:
  # selector determines which pods the service targets
  selector:
    project: roboshop
    component: database
    tier: backend
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017