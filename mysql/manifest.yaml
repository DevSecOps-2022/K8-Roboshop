apiVersion: v1
kind: Secret
metadata:
  name: mysql-config
  namespace: roboshop
type: Opaque
data: 
  MYSQL_ALLOW_EMPTY_PASSWORD: "eWVzCg=="

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: mysql
      environment: dev
  template:
    metadata:
      labels:
        project: roboshop
        component: mysql
        environment: dev
    spec:
      containers:
      - name: mysql
        image: hanumanth897/mysql:4.0.0
        envFrom:
        - configMapRef:
            name: mysql-config
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    environment: dev
spec:
  selector:
    project: roboshop
    component: mysql
    environment: dev
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306

