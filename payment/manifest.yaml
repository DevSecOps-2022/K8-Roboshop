apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: roboshop
data: 
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
  namespace: roboshop
type: Opaque
data:
  AMQP_USER: cm9ib3Nob3A=
  AMQP_PASS: cm9ib3Nob3AxMjM=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: roboshop
  labels:
    project: roboshop
    component: payment
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: payment
      environment: dev
  template:
    metadata:
      labels:
        project: roboshop
        component: payment
        environment: dev
    spec:
      containers:
      - name: payment
        image: hanumanth897/payment:4.0.0
        envFrom:
        - configMapRef:
            name: payment-config
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: roboshop
  labels:
    project: roboshop
    component: payment
    environment: dev
spec:
  selector:
    project: roboshop
    component: payment
    environment: dev
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

