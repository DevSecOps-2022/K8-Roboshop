apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
  namespace: roboshop
type: Opaque
data:
  RABBITMQ_DEFAULT_USER: cm9ib3Nob3A=
  RABBITMQ_DEFAULT_PASS: cm9ib3Nob3AxMjM=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: roboshop
  # labels related to deployment
  labels:
    project: roboshop
    component: rabbitmq
    tier: backend
spec:
  replicas: 1
  selector: 
    # match labels for the pods managed by this deployment
    matchLabels:
      project: roboshop
      component: rabbitmq
      tier: backend
  template:
    metadata:
    # labels for the pods within this template
      labels:
        project: roboshop
        component: rabbitmq
        tier: backend
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3
        envFrom:
        - secretRef:
            name: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop
  # labels related to service
  labels:
    project: roboshop
    component: rabbitmq
    tier: backend
spec:
  # selector determines which pods the service targets
  selector:
    project: roboshop
    component: rabbitmq
    tier: backend
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672