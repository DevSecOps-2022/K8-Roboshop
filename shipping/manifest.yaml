apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping-config
  namespace: roboshop
data: 
  CART_ENDPOINT: "cart:8080"
  DB_HOST: "mysql"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: roboshop
  labels:
    project: roboshop
    component: shipping
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: shipping
      environment: dev
  template:
    metadata:
      labels:
        project: roboshop
        component: shipping
        environment: dev
    spec:
      containers:
      - name: shipping
        image: hanumanth897/shipping:4.0.0
        envFrom:
        - configMapRef:
            name: shipping-config
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: roboshop
  labels:
    project: roboshop
    component: shipping
    environment: dev
spec:
  selector:
    project: roboshop
    component: shipping
    environment: dev
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

