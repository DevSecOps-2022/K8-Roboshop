apiVersion: v1
kind: ConfigMap
metadata:
  name: user-config
  namespace: roboshop
data: 
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/user"
  REDIS_URL: "redis://redis:6379"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: user
      environment: dev
  template:
    metadata:
      labels:
        project: roboshop
        component: user
        environment: dev
    spec:
      containers:
      - name: user
        image: hanumanth897/user:4.0.0
        envFrom:
        - configMapRef:
            name: user-config
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    environment: dev
spec:
  selector:
    project: roboshop
    component: user
    environment: dev
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

